name: Graphite Innovation and Technologies
description: Graphite Innovation and Technologies Inc, operating as GIT Coatings, is a Canadian materials-science
  company that develops sustainable, graphene-based marine coatings for commercial ships. Its biocide-free
  hard foul-release hull and propeller coatings, including XGIT-FORCE, XGIT-VORTEX, and XGIT-PROP, cut fuel
  consumption, reduce drag, and eliminate leaching to protect the marine environment. The company is a
  Techstars-backed portfolio company. It is a physical-products manufacturer and publishes no public developer
  API, SDKs, or API documentation; this profile is maintained in the API Evangelist network for company-level
  discovery and coverage.
